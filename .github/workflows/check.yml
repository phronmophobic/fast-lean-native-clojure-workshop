name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - answers

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] #, windows-2022]
        jdk: ['25']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSVC for the struct fixture
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The download from objects.githubusercontent.com fails now and then
      # with curl exit 8, a reply curl cannot parse. Retrying clears it.
      - name: Install babashka dev build
        run: |
          for i in 1 2 3; do
            bash <(curl -fsS https://raw.githubusercontent.com/babashka/babashka/master/install) --dir bin --dynamic && exit 0
            sleep 5
          done
          exit 1

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang binutils
          which ld
          # graalvm deps
          sudo apt-get install -y build-essential zlib1g-dev

      - name: macOS deps
        if: runner.os == 'macOS'
        run: |
          # brew install cmake
          echo 'done'

      - name: Test examples clang
        run: |
          # bin, not the repository root: bb/ there holds the build helpers
          if [ "$RUNNER_OS" = "Windows" ]; then bb=bin/bb.exe; else bb=bin/bb; fi
          export CC=clang
          export CXX=clang++
          which "$CC"
          "$CC" --version
          "$bb" test

      - name: Test examples gcc
        run: |
          # bin, not the repository root: bb/ there holds the build helpers
          if [ "$RUNNER_OS" = "Windows" ]; then bb=bin/bb.exe; else bb=bin/bb; fi
          export CC=gcc
          which "$CC"
          "$CC" --version
          "$bb" test

